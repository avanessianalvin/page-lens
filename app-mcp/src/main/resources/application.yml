spring:
  application:
    name: pagelens-mcp
  main:
    # stdout is the MCP protocol channel: never print a banner or bind a web server.
    banner-mode: off
    web-application-type: none
  # Shared settings (database, Flyway, .env loading) come from core's classpath:/config/application.yml.
  # Claude launches this process from an arbitrary working directory, so pass settings as env vars in the
  # MCP client config, or set PAGELENS_ENV_FILE to an absolute path (scripts/pagelens-mcp.* do this).
  profiles:
    default: dev

pagelens:
  mcp:
    stdio-enabled: true
    sync-tool-enabled: ${PAGELENS_MCP_SYNC_TOOL:true}
    # Claude's write tools (reply_to_comment, hide_comment, publish_post) need BOTH this and
    # PAGELENS_WRITE_ACTIONS_ENABLED=true. Off by default.
    write-tools-enabled: ${PAGELENS_MCP_WRITE_TOOLS:false}
